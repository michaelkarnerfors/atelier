# ─────────────────────────────────────────────────────────────────
# .vale.ini — Vale prose linter configuration
#
# First-time setup (run once after installing Vale):
#   vale sync
#
# Then lint your manuscript with:
#   ./build.sh lint   (or: make lint)
#
# To disable a specific rule, add a line like:
#   write-good.Passive = NO
# ─────────────────────────────────────────────────────────────────

StylesPath = .vale/styles
MinAlertLevel = warning

Packages = write-good, proselint

[manuscript/*.md]
BasedOnStyles = write-good, proselint, Fiction
