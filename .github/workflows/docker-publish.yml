# ──────────────────────────────────────────────────────────────────
# docker-publish.yml
#
# Builds the Atelier Docker image and publishes it to the GitHub
# Container Registry (ghcr.io) on every push to main, and on
# version tags (v1.0.0, v1.2.3, …).
#
# The image is published as:
#   ghcr.io/michaelkarnerfors/atelier:latest   ← always tracks main
#   ghcr.io/michaelkarnerfors/atelier:v1.0.0   ← pinned release
#
# No secrets to configure — GITHUB_TOKEN is used automatically.
# ──────────────────────────────────────────────────────────────────

name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
